[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "textkeel"
version = "0.1.0"
description = "Zero-Python, zero-PII local Rust TF-IDF + Multinomial Logistic text classifier with phrase attribution & offline browser playground export."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
keywords = ["nlp", "tfidf", "text-classification", "ml", "cli", "keel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/robertguss/textkeel"
Repository = "https://github.com/robertguss/textkeel"
Issues = "https://github.com/robertguss/textkeel/issues"

[tool.maturin]
bindings = "bin"
strip = true
