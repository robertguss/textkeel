[package]
name = "textkeel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Zero-Python, zero-PII local Rust TF-IDF + L2 Multinomial Logistic text classifier with phrase attribution & offline in-browser HTML playground export (DX + AX)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertguss/textkeel"
homepage = "https://github.com/robertguss/textkeel"
keywords = ["nlp", "tfidf", "text-classification", "ml", "cli"]
categories = ["command-line-utilities", "science", "text-processing"]

[dependencies]
arrow-array = "60.2"
arrow-cast = "60.2"
arrow-schema = "60.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
indexmap = { version = "2.14", features = ["serde"] }
owo-colors = { version = "4.4", features = ["supports-colors"] }
parquet = { version = "60.2", default-features = false, features = ["arrow", "snap", "flate2-rust_backend", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
